name: Lingos Non-Stop Turbo Bot

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-lingos-turbo:
    runs-on: ubuntu-latest
    concurrency:
      group: lingos-loop
      cancel-in-progress: true

    steps:
      - name: Pobieranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalacja Google Chrome i czyszczenie ChromeDrivera
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y
          # Usunięcie starego chromedrivera z systemu, aby Selenium pobrało właściwy
          sudo rm -f /usr/bin/chromedriver

      - name: Instalacja bibliotek Python
        run: |
          pip install selenium

      - name: Uruchomienie Bota TURBO (5 Godzin)
        env:
          PYTHONUNBUFFERED: "1"
          LINGOS_LOGIN: ${{ secrets.LINGOS_LOGIN }}
          LINGOS_PASSWORD: ${{ secrets.LINGOS_PASSWORD }}
        run: python bot.py
